name: Build native GTA exporter

on:
  push:
    branches: [main]
    paths:
      - "native-engine/**"
      - ".github/workflows/native-engine-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure native engine
        run: cmake -S native-engine -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Compile Windows x64 exporter
        run: cmake --build build/native --config Release --parallel 2
      - name: Verify executable
        shell: pwsh
        run: |
          $binary = "build/native/Release/island-forge-native-engine.exe"
          if (!(Test-Path $binary)) { throw "Native exporter executable was not produced." }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "Native exporter version check failed." }
      - name: Publish integrated native engine
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-engine-v0.1.0
          name: Island Forge Native Engine v0.1.0
          target_commitish: main
          body: |
            Windows x64 native GTA RAGE exporter bundled with Island Forge.
            Built from native-engine/ using ragekit.
            The executable is downloaded automatically by npm run dev and stored under .islandforge/bin/.
          files: build/native/Release/island-forge-native-engine.exe
          fail_on_unmatched_files: true
