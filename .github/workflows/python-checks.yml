name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q island_generator tools
      - name: Build Blender add-on ZIP
        run: python tools/build_addon_zip.py
      - name: Verify package archive
        run: python -c "from zipfile import ZipFile; z=ZipFile('dist/fivem_island_generator_addon.zip'); assert 'island_generator/__init__.py' in z.namelist()"
